openapi: 3.0.3
info:
  title: CloudLab API
  description: API documentation for CloudLab, a browser-based cloud development environment.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /projects:
    get:
      summary: Get all projects for the authenticated user
      responses:
        '200':
          description: A list of projects
        '401':
          description: Unauthorized
    post:
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Project created successfully
        '401':
          description: Unauthorized
        '400':
          description: Bad request

  /workspace/files:
    get:
      summary: List files in a workspace
      parameters:
        - in: query
          name: workspace
          schema:
            type: string
          required: true
          description: The workspace ID or name
        - in: query
          name: path
          schema:
            type: string
          required: false
          description: The directory path to list
      responses:
        '200':
          description: A list of files and directories
        '400':
          description: Missing workspace parameter
        '401':
          description: Unauthorized or Insufficient access
        '404':
          description: Workspace or path not found

  /workspace/file:
    get:
      summary: Read a file
      parameters:
        - in: query
          name: workspace
          schema:
            type: string
          required: true
        - in: query
          name: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: File content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: File not found
    post:
      summary: Write to a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspace:
                  type: string
                path:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: File saved successfully
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error

  /admin/stats:
    get:
      summary: Get admin overview statistics
      responses:
        '200':
          description: Platform statistics
        '401':
          description: Unauthorized (Admin only)
        '403':
          description: Forbidden

  /admin/users:
    get:
      summary: List all users
      responses:
        '200':
          description: A list of users
        '401':
          description: Unauthorized (Admin only)
        '403':
          description: Forbidden

  /admin/containers:
    get:
      summary: List running Docker containers
      responses:
        '200':
          description: A list of Docker containers
        '401':
          description: Unauthorized (Admin only)
    delete:
      summary: Force kill a Docker container
      parameters:
        - in: query
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Container killed successfully
        '400':
          description: Missing ID
        '401':
          description: Unauthorized

  /admin/ai:
    get:
      summary: List AI usage logs
      responses:
        '200':
          description: A list of AI logs
        '401':
          description: Unauthorized

  /admin/audit:
    get:
      summary: List Audit logs
      responses:
        '200':
          description: A list of Audit logs
        '401':
          description: Unauthorized

  /admin/workspaces/{id}/stop:
    post:
      summary: Stop a workspace and forcefully terminate its Docker container
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Workspace disabled and container killed
        '401':
          description: Unauthorized
        '404':
          description: Workspace not found
